spring.application.name=jumpin-backend
server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.connection-timeout=15s
server.tomcat.max-http-form-post-size=64KB
spring.mvc.log-request-details=false
spring.jackson.deserialization.fail-on-unknown-properties=true
jumpin.access-token=${JUMPIN_ACCESS_TOKEN:}
jumpin.openai-api-key=${OPENAI_API_KEY:}
jumpin.openai-model=${OPENAI_MODEL:gpt-4.1-mini}
jumpin.openai-base-url=https://api.openai.com/v1/
